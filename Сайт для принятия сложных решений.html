<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сайт для принятия сложных решений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece9f6;--ink:#231a4a;--soft:#6b6590;--line:#c9c2e4;--card:#fff;--btn:#231a4a;--on-btn:#fff;--g1:#f7d56a;--g2:#e0a928;--g3:#7a4e07;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--ink:#efeaff;--soft:#a59fc9;--line:#3a3366;--card:#201a40;--btn:#f3c64f;--on-btn:#2a1c00}}
:root[data-theme="dark"]{--bg:#15112b;--ink:#efeaff;--soft:#a59fc9;--line:#3a3366;--card:#201a40;--btn:#f3c64f;--on-btn:#2a1c00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.05rem}
.screen{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;padding:clamp(28px,12vh,110px) 22px 40px;text-align:center;animation:in .3s ease-out}
.screen[hidden]{display:none}
@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2{font-family:"Unbounded","Onest",system-ui,Arial,sans-serif;font-weight:700;line-height:1.18;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h1{font-size:clamp(1.5rem,5.6vw,2.5rem);max-width:17em}
h2{font-size:clamp(1.35rem,5vw,2rem);max-width:16em}
.btn{font-family:"Unbounded","Onest",system-ui,Arial,sans-serif;font-weight:500;background:var(--btn);color:var(--on-btn);border:0;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:hover{transform:scale(1.03)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--g2);outline-offset:3px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.round{width:136px;height:136px;border-radius:50%;font-size:1.05rem;margin-top:clamp(28px,6vh,52px)}
.pill{border-radius:999px;padding:17px 38px;font-size:1rem;margin-top:26px}
.fields{width:100%;max-width:440px;margin-top:34px;display:grid;gap:18px;text-align:left}
label{display:grid;gap:7px;font-weight:600;color:var(--soft);font-size:.95rem}
input{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px 16px;width:100%}
input::placeholder{color:var(--soft);opacity:.6}
.stage{position:relative;height:380px;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;perspective:900px;margin-top:6px}
.lift{position:relative;z-index:1}
.coin{width:172px;height:172px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
background:radial-gradient(circle at 32% 26%,#fcfcf9,#dadad4 55%,#adada6);box-shadow:inset 0 0 0 3px #f1f1ec,inset 0 0 0 5px #8f8f89,inset 0 -10px 20px rgba(60,60,55,.3),0 1px 0 #77776f}
.art{width:100%;height:100%;display:block}
.back{transform:rotateX(180deg)}
.shade{position:absolute;bottom:14px;width:120px;height:18px;border-radius:50%;background:rgba(20,10,50,.28);filter:blur(5px)}
.cap{color:var(--soft);margin:10px 0 0;min-height:1.5em;overflow-wrap:anywhere;max-width:26em}
.note{color:var(--soft);font-size:.9rem;margin:2px 0 0;max-width:22em}
.link{background:none;border:0;color:var(--soft);font:inherit;font-size:.9rem;text-decoration:underline;text-underline-offset:4px;margin-top:20px;cursor:pointer;padding:8px}
#top{transition:opacity .25s}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.btn{transition:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>
<main>
<section class="screen" id="s1">
  <h1>Сайт для принятия сложных решений</h1>
  <button class="btn round" id="open" type="button">Открыть</button>
</section>

<section class="screen" id="s2" hidden>
  <h2>Что выбираем?</h2>
  <div class="fields">
    <label>Первый вариант<input id="a" type="text" maxlength="60" autocomplete="off" placeholder="Например, остаться дома"></label>
    <label>Второй вариант<input id="b" type="text" maxlength="60" autocomplete="off" placeholder="Например, пойти гулять"></label>
  </div>
  <button class="btn pill" id="go" type="button" disabled>Продолжить</button>
</section>

<section class="screen" id="s3" hidden>
  <h2 id="top" aria-live="polite">Орёл и решка</h2>
  <p class="cap" id="cap"></p>
  <div class="stage">
    <div class="shade" id="shade"></div>
    <div class="lift" id="lift">
      <div class="coin" id="coin">
        <div class="face front">
<svg class="art" viewBox="0 0 200 200" role="img" aria-label="Орёл">
<defs><path id="arcT" d="M30 100 A70 70 0 0 1 170 100"/><path id="arcB" d="M26 100 A74 74 0 0 0 174 100"/></defs>
<g filter="url(#wob)" fill="none" stroke="#55554f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="100" cy="100" r="93" stroke-width="3"/>
<circle cx="100" cy="100" r="86" stroke-width="1.2" stroke-dasharray="1 4"/>
<text font-size="13" font-weight="700" fill="#55554f" stroke="none" font-family="Georgia,'Times New Roman',serif" letter-spacing="2"><textPath href="#arcT" startOffset="50%" text-anchor="middle">БАНК РОССИИ</textPath></text>
<text font-size="13" font-weight="700" fill="#55554f" stroke="none" font-family="Georgia,'Times New Roman',serif" letter-spacing="2"><textPath href="#arcB" startOffset="50%" text-anchor="middle">ОДИН РУБЛЬ</textPath></text>
<g id="wing" fill="#e8e8e3">
<path d="M92 84 C72 70 48 72 34 92 C34 110 44 124 60 132 C68 118 80 110 94 108Z"/>
<path d="M44 90 Q62 94 78 102 M42 104 Q60 106 76 112 M48 118 Q62 118 76 120"/>
<path d="M93 122 Q80 126 70 136 M70 136 L63 138 M70 136 L66 143 M70 136 L74 130"/>
</g>
<use href="#wing" transform="translate(200 0) scale(-1 1)"/>
<path d="M100 70 C88 78 86 100 90 124 L100 128 L110 124 C114 100 112 78 100 70Z" fill="#e8e8e3"/>
<path d="M94 90 q6 6 12 0 M93 100 q7 6 14 0 M94 110 q6 6 12 0"/>
<path d="M90 124 L86 152 Q100 158 114 152 L110 124Z M95 130 L93 152 M100 130 L100 155 M105 130 L107 152" fill="#e8e8e3"/>
<path d="M90 66 Q93 72 100 76 Q107 72 110 66"/>
<circle cx="87" cy="58" r="7" fill="#e8e8e3"/><path d="M81 56 L70 53 L81 61"/>
<circle cx="113" cy="58" r="7" fill="#e8e8e3"/><path d="M119 56 L130 53 L119 61"/>
<path d="M92 46 L94 40 L97 44 L100 38 L103 44 L106 40 L108 46Z" fill="#e8e8e3"/>
</g></svg>
        </div>
        <div class="face back">
<svg class="art" viewBox="0 0 200 200" role="img" aria-label="Решка">
<g filter="url(#wob)" fill="none" stroke="#55554f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="100" cy="100" r="93" stroke-width="3"/>
<circle cx="100" cy="100" r="86" stroke-width="1.2" stroke-dasharray="1 4"/>
<path d="M42 86 L76 62 L76 132 L61 132 L61 82 L42 96Z" fill="#e8e8e3" stroke-width="2.4"/>
<text x="100" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#55554f" stroke="none" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">РУБЛЬ</text>
<path d="M116 150 C112 132 118 114 128 100 C136 88 134 74 128 66"/>
<path d="M128 100 C146 98 152 84 142 76 C134 72 128 80 134 86"/>
<path d="M122 120 C110 112 100 114 98 104 C108 100 120 108 122 120Z M126 132 C140 128 150 134 152 144 C140 148 128 142 126 132Z" fill="#e8e8e3"/>
<circle cx="128" cy="62" r="4" fill="#e8e8e3"/>
<path d="M128 66 C118 60 112 66 114 74 M128 66 C138 58 146 62 146 70"/>
</g></svg>
        </div>
      </div>
    </div>
  </div>
  <button class="btn pill" id="toss" type="button">Подкинуть</button>
  <button class="link" id="edit" type="button">Изменить варианты</button>
  <p class="note">если вариант не понравился, ты знаешь правильный ответ</p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = 0, busy = false;

function show(id){
  ['s1','s2','s3'].forEach(s => $(s).hidden = s !== id);
  window.scrollTo(0,0);
}
function vals(){ return [$('a').value.trim(), $('b').value.trim()]; }
function check(){ const [x,y] = vals(); $('go').disabled = !(x && y); }
function resetTop(){
  const [x,y] = vals();
  $('top').textContent = 'Орёл и решка';
  $('cap').textContent = 'Орёл — ' + x + ' · Решка — ' + y;
}

$('open').onclick = () => { show('s2'); $('a').focus(); };
$('a').oninput = $('b').oninput = check;
$('a').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); $('b').focus(); } };
$('b').onkeydown = e => { if(e.key === 'Enter' && !$('go').disabled) $('go').click(); };
$('go').onclick = () => { resetTop(); show('s3'); };
$('edit').onclick = () => { if(busy) return; show('s2'); $('a').focus(); };

$('toss').onclick = () => {
  if(busy) return;
  busy = true; $('toss').disabled = true; $('edit').disabled = true;
  const [x,y] = vals();
  const eagle = (crypto.getRandomValues(new Uint8Array(1))[0] & 1) === 0;   // честные 50/50
  const final = eagle ? 0 : 180;
  const target = cur - (cur % 360) + 360 * 6 + final;
  const dur = reduce ? 500 : 1900;
  $('top').style.opacity = .25;
  const coin = $('coin');
  const spin = coin.animate(
    [{transform:`rotateX(${cur}deg)`},{transform:`rotateX(${target}deg)`}],
    {duration:dur, easing:'cubic-bezier(.22,.6,.3,1)', fill:'forwards'});
  if(!reduce){
    $('lift').animate([
      {transform:'translateY(0) scale(1)',offset:0,easing:'cubic-bezier(.2,.7,.4,1)'},
      {transform:'translateY(-190px) scale(1.18)',offset:.46,easing:'cubic-bezier(.6,0,.8,.4)'},
      {transform:'translateY(0) scale(1)',offset:.88,easing:'ease-out'},
      {transform:'translateY(-14px) scale(1)',offset:.94,easing:'ease-in'},
      {transform:'translateY(0) scale(1)',offset:1}
    ],{duration:dur});
    $('shade').animate([
      {transform:'scale(1)',opacity:1,offset:0},
      {transform:'scale(.55)',opacity:.4,offset:.46},
      {transform:'scale(1)',opacity:1,offset:.88},
      {transform:'scale(.9)',opacity:.85,offset:.94},
      {transform:'scale(1)',opacity:1,offset:1}
    ],{duration:dur});
  }
  spin.onfinish = () => {
    cur = final;
    coin.style.transform = `rotateX(${final}deg)`;
    spin.cancel();
    $('top').textContent = eagle ? x : y;
    $('cap').textContent = eagle ? 'Выпал орёл' : 'Выпала решка';
    $('top').style.opacity = 1;
    busy = false; $('toss').disabled = false; $('edit').disabled = false;
    $('toss').textContent = 'Подкинуть ещё раз';
  };
};
</script>
</body>
</html>
